name: Generate Snake Animation

on:
  # Jalankan otomatis setiap jam 12 malam (UTC)
  schedule:
    - cron: "0 0 * * *"
  
  # Izinkan untuk dijalankan secara manual kapan saja dari tab Actions
  workflow_dispatch:

  # Jalankan otomatis setiap ada push ke branch main / master
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Generate animasi ular (Snake SVG)
      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300FF66

      # Step 3: Push file gambar hasil ke branch 'output'
      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
